<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>方舟动物园 · 休息收入记录</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
    --green-900: #1b4332;
    --green-700: #2d6a4f;
    --green-500: #40916c;
    --green-100: #d8f3dc;
    --orange: #e76f51;
    --orange-dark: #c4593c;
    --gold: #e9b949;
    --cream: #faf6ee;
    --ink: #1f2a24;
    --muted: #6c7a72;
    --line: #e3dcc9;
    --card: #ffffff;
    --shadow: 0 2px 10px rgba(31, 42, 36, 0.08);
    --shadow-lg: 0 6px 24px rgba(31, 42, 36, 0.12);
}

html, body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: var(--cream);
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
}

body { padding-bottom: 80px; min-height: 100vh; }

/* ===== Header ===== */
.app-header {
    position: sticky; top: 0; z-index: 50;
    background: linear-gradient(135deg, var(--green-900), var(--green-700));
    color: #fff;
    padding: 14px 16px;
    box-shadow: 0 2px 12px rgba(27, 67, 50, 0.25);
}
.app-header .brand {
    display: flex; align-items: center; justify-content: space-between;
}
.app-header .brand .title { font-size: 17px; font-weight: 700; letter-spacing: 0.5px; }
.app-header .brand .title .sub { font-size: 11px; font-weight: 400; opacity: 0.7; margin-left: 6px; }
.app-header .brand .actions { display: flex; gap: 6px; }
.icon-btn {
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    width: 32px; height: 32px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background 0.15s;
}
.icon-btn:active { background: rgba(255,255,255,0.28); }

/* ===== Main ===== */
.main { padding: 14px; max-width: 720px; margin: 0 auto; }

/* ===== Player tabs ===== */
.player-tabs {
    display: flex; gap: 8px;
    overflow-x: auto;
    padding: 2px 0 12px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
}
.player-tabs::-webkit-scrollbar { display: none; }
.player-chip {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 6px;
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 999px;
    padding: 6px 12px 6px 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    transition: all 0.15s;
    max-width: 200px;
}
.player-chip .swatch {
    width: 22px; height: 22px;
    border-radius: 50%;
    flex-shrink: 0;
    border: 2px solid rgba(0,0,0,0.1);
}
.player-chip .name {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 120px;
}
.player-chip.active {
    border-color: var(--green-700);
    color: var(--green-900);
    background: var(--green-100);
}
.player-chip.add {
    background: transparent;
    border-style: dashed;
    color: var(--green-700);
}
.player-chip .score-mini {
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
    margin-left: 2px;
}
.player-chip.active .score-mini { color: var(--orange-dark); }

/* ===== Cards ===== */
.card {
    background: var(--card);
    border-radius: 14px;
    box-shadow: var(--shadow);
    margin-bottom: 12px;
    overflow: hidden;
}
.card-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #fff, #fcfaf3);
}
.card-head .label {
    font-size: 14px; font-weight: 700; color: var(--green-900);
    display: flex; align-items: center; gap: 8px;
}
.card-head .label .ico { font-size: 16px; }
.card-head .meta {
    font-size: 13px;
    color: var(--muted);
    font-weight: 600;
}
.card-head .meta b { color: var(--green-700); font-size: 15px; }
.card-body { padding: 12px 14px 14px; }

/* ===== Player header card ===== */
.player-card-head {
    display: flex; align-items: center; gap: 12px;
    padding: 14px;
    background: var(--card);
    border-radius: 14px;
    box-shadow: var(--shadow);
    margin-bottom: 12px;
}
.player-card-head .color-pick {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 3px solid #fff;
    box-shadow: 0 0 0 2px var(--line);
    cursor: pointer;
    flex-shrink: 0;
}
.player-card-head input.name-input {
    flex: 1;
    border: 0;
    border-bottom: 2px solid var(--line);
    background: transparent;
    font-size: 17px;
    font-weight: 700;
    color: var(--ink);
    padding: 6px 4px;
    font-family: inherit;
}
.player-card-head input.name-input:focus { outline: 0; border-bottom-color: var(--green-500); }
.player-card-head .del-btn {
    background: transparent;
    border: 0;
    color: var(--muted);
    font-size: 20px;
    cursor: pointer;
    padding: 4px 8px;
}

/* ===== Track rows (盾轨 / 票轨) ===== */
.track-row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--line);
}
.track-row:last-child { border-bottom: 0; }
.track-row .info .name { font-size: 14px; font-weight: 600; }
.track-row .info .desc { font-size: 11px; color: var(--muted); margin-top: 2px; }
.num-stepper {
    display: flex; align-items: center;
    background: var(--cream);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
}
.num-stepper button {
    width: 36px; height: 36px;
    background: transparent;
    border: 0;
    color: var(--green-700);
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.12s;
    flex-shrink: 0;
}
.num-stepper button:active { background: var(--green-100); }
.num-stepper input {
    width: 56px;
    text-align: center;
    border: 0;
    background: transparent;
    font-size: 17px;
    font-weight: 700;
    color: var(--ink);
    font-family: inherit;
    padding: 6px 0;
}
.num-stepper input:focus { outline: 0; background: #fff; }

.track-hint {
    font-size: 11px;
    color: var(--muted);
    background: var(--green-100);
    border-left: 3px solid var(--green-500);
    padding: 6px 10px;
    border-radius: 4px;
    margin-top: 8px;
}

/* ===== Income round card ===== */
.round-card {
    background: var(--card);
    border-radius: 14px;
    box-shadow: var(--shadow);
    margin-bottom: 12px;
    overflow: hidden;
    border-left: 4px solid var(--green-500);
}
.round-card .round-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px;
    background: linear-gradient(180deg, #fff, #fcfaf3);
    border-bottom: 1px solid var(--line);
}
.round-card .round-head .title {
    font-size: 14px; font-weight: 700; color: var(--green-900);
    display: flex; align-items: center; gap: 6px;
}
.round-card .round-head .total {
    font-size: 15px; font-weight: 700; color: var(--orange-dark);
}
.round-card .round-head .del {
    background: transparent; border: 0; color: var(--muted);
    font-size: 18px; cursor: pointer; padding: 2px 6px; margin-left: 8px;
}
.round-card .round-body { padding: 6px 14px 12px; }

.income-row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 1px dashed var(--line);
}
.income-row:last-child { border-bottom: 0; }
.income-row .label-name { font-size: 13px; }
.income-row .label-name .desc { font-size: 11px; color: var(--muted); display: block; margin-top: 2px; }
.income-row .label-name .badge {
    display: inline-block;
    font-size: 10px;
    color: var(--orange-dark);
    background: #fde9e3;
    padding: 1px 6px;
    border-radius: 4px;
    margin-left: 4px;
    font-weight: 600;
}
.num-input {
    width: 70px;
    text-align: center;
    border: 1px solid var(--line);
    background: var(--cream);
    border-radius: 8px;
    padding: 7px 6px;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    font-family: inherit;
}
.num-input:focus { outline: 2px solid var(--green-500); background: #fff; }
.calc-display {
    min-width: 70px;
    text-align: center;
    background: var(--green-100);
    color: var(--green-700);
    border-radius: 8px;
    padding: 7px 6px;
    font-size: 15px;
    font-weight: 700;
}
.calc-display.pending {
    background: #fde9e3;
    color: var(--orange-dark);
}
.row-total {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 6px; padding-top: 8px;
    border-top: 1.5px solid var(--green-100);
}
.row-total .lbl { font-size: 13px; font-weight: 700; color: var(--green-900); }
.row-total .val { font-size: 18px; font-weight: 800; color: var(--orange-dark); }

.add-round-btn {
    width: 100%;
    background: var(--green-700);
    color: #fff;
    border: 0;
    padding: 12px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s;
}
.add-round-btn:active { background: var(--green-900); }
.add-round-btn:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }

/* ===== Sticky total bar ===== */
.total-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(135deg, var(--green-900), var(--green-700));
    color: #fff;
    padding: 12px 16px;
    display: flex; justify-content: space-between; align-items: center;
    box-shadow: 0 -4px 16px rgba(27, 67, 50, 0.2);
    z-index: 40;
}
.total-bar .label { font-size: 12px; opacity: 0.8; }
.total-bar .player-name { font-size: 14px; font-weight: 600; margin-top: 1px; }
.total-bar .total {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
}
.total-bar .total .small { font-size: 12px; font-weight: 500; opacity: 0.7; }
.total-bar .tracks {
    font-size: 11px;
    opacity: 0.85;
    margin-top: 2px;
}
.total-bar .tracks b { font-weight: 700; }

/* ===== Empty state ===== */
.empty-state {
    text-align: center;
    padding: 50px 20px;
    color: var(--muted);
}
.empty-state .big { font-size: 48px; margin-bottom: 12px; }

/* ===== Color picker popover ===== */
.color-pop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 100;
    display: none;
    align-items: center; justify-content: center;
    padding: 20px;
}
.color-pop.show { display: flex; }
.color-pop .panel {
    background: #fff;
    border-radius: 14px;
    padding: 18px;
    max-width: 320px;
    width: 100%;
}
.color-pop .panel h4 { font-size: 14px; margin-bottom: 12px; color: var(--green-900); }
.color-pop .swatches {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
}
.color-pop .swatches .sw {
    aspect-ratio: 1;
    border-radius: 50%;
    border: 2px solid rgba(0,0,0,0.1);
    cursor: pointer;
    transition: transform 0.1s;
}
.color-pop .swatches .sw:active { transform: scale(0.9); }

/* ===== Confirm dialog ===== */
.confirm-pop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 110;
    display: none;
    align-items: center; justify-content: center;
    padding: 24px;
}
.confirm-pop.show { display: flex; }
.confirm-pop .panel {
    background: #fff;
    border-radius: 14px;
    padding: 20px;
    max-width: 320px;
    width: 100%;
    text-align: center;
}
.confirm-pop .panel p { font-size: 14px; margin-bottom: 16px; color: var(--ink); }
.confirm-pop .panel .btns { display: flex; gap: 10px; }
.confirm-pop .panel .btns button {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 0;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
}
.confirm-pop .panel .btns .yes { background: var(--orange); color: #fff; }
.confirm-pop .panel .btns .no { background: var(--cream); color: var(--muted); border: 1px solid var(--line); }

/* ===== Toast ===== */
.toast {
    position: fixed;
    bottom: 96px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(27, 42, 36, 0.95);
    color: #fff;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 13px;
    z-index: 200;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<header class="app-header">
    <div class="brand">
        <div class="title">方舟动物园 · 休息收入记录<span class="sub">Break Income Tracker</span></div>
        <div class="actions">
            <button class="icon-btn" id="btn-save" title="保存">💾</button>
            <button class="icon-btn" id="btn-reset" title="重置">↺</button>
        </div>
    </div>
</header>

<main class="main">
    <div id="players-area"></div>
</main>

<!-- ============ Sticky total bar ============ -->
<div class="total-bar" id="total-bar">
    <div>
        <div class="label">累计总收入</div>
        <div class="player-name" id="total-bar-name">—</div>
        <div class="tracks" id="total-bar-tracks"></div>
    </div>
    <div class="total" id="total-bar-value">0<span class="small"> 钱</span></div>
</div>

<!-- ============ Color picker popover ============ -->
<div class="color-pop" id="color-pop">
    <div class="panel">
        <h4>选择玩家颜色</h4>
        <div class="swatches" id="color-swatches"></div>
    </div>
</div>

<!-- ============ Confirm dialog ============ -->
<div class="confirm-pop" id="confirm-pop">
    <div class="panel">
        <p id="confirm-msg">确定要重置所有数据吗？</p>
        <div class="btns">
            <button class="no" id="confirm-no">取消</button>
            <button class="yes" id="confirm-yes">确定</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ============ Constants ============ */
const STORAGE_KEY = "ark-nova-break-income-v1";

const PLAYER_COLORS = [
    "#e63946", "#2a9d8f", "#f4a261", "#457b9d",
    "#9b5de5", "#ffb703", "#06d6a0", "#ef476f",
    "#118ab2", "#fb8500"
];

const DEFAULT_NAMES = ["玩家 1", "玩家 2", "玩家 3", "玩家 4", "玩家 5", "玩家 6"];

/* ============ State ============ */
let state = {
    players: [],
    activeId: null
};

let pendingColorPickFor = null;
let pendingConfirmCb = null;

/* ============ Persistence ============ */
function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}
function load() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && Array.isArray(parsed.players)) {
                state = parsed;
                if (!state.activeId && state.players.length) state.activeId = state.players[0].id;
            }
        }
    } catch(e) {}
}

/* ============ Helpers ============ */
function uid() { return "r" + Date.now().toString(36) + Math.random().toString(36).slice(2,5); }

function newPlayer(idx) {
    return {
        id: uid(),
        name: DEFAULT_NAMES[idx] || ("玩家 " + (idx+1)),
        color: PLAYER_COLORS[idx % PLAYER_COLORS.length],
        conservation: 0,   // 盾轨：保护项目点数
        appeal: 0,         // 票轨：魅力点数
        rounds: []         // 每轮休息收入记录
    };
}

function newRound(p) {
    // 记录一轮休息时快照当前盾轨/票轨
    return {
        id: uid(),
        conservation: Number(p.conservation) || 0,
        appeal: Number(p.appeal) || 0,
        kioskIncome: 0,    // 贩售亭收入（用户输入）
        cardIncome: 0      // 卡牌额外收入（用户输入）
    };
}

/**
 * 魅力对应收入计算（公式待用户补充）
 * @param {number} conservation 盾轨（保护项目点数）快照
 * @param {number} appeal       票轨（魅力点数）快照
 * @return {number} 本轮休息由魅力对应得到的钱数
 *
 * TODO: 待用户提供官方魅力→钱数映射表/公式后在此实现。
 * 当前返回 0 作为占位，UI 会显示「公式待补充」。
 */
function calcAppealIncome(conservation, appeal) {
    const c = Number(conservation) || 0;
    const a = Number(appeal) || 0;
    void c; void a;
    return 0;
}

const APPEAL_INCOME_PENDING = true; // 公式是否待补充

function roundAppealIncome(r) {
    return calcAppealIncome(r.conservation, r.appeal);
}
function roundTotal(r) {
    return roundAppealIncome(r) + (Number(r.kioskIncome) || 0) + (Number(r.cardIncome) || 0);
}
function playerTotal(p) {
    return (p.rounds || []).reduce((s, r) => s + roundTotal(r), 0);
}

function getActivePlayer() {
    return state.players.find(p => p.id === state.activeId) || state.players[0] || null;
}

/* ============ Rendering ============ */
function render() {
    const area = document.getElementById("players-area");
    area.innerHTML = "";

    if (state.players.length === 0) {
        area.innerHTML = `
            <div class="empty-state">
                <div class="big">🦁</div>
                <div>还没有玩家，先添加一位开始记录。</div>
            </div>`;
        addAddPlayerChip(area);
        updateTotalBar();
        return;
    }

    // Player chips
    const tabs = document.createElement("div");
    tabs.className = "player-tabs";
    state.players.forEach(p => {
        const chip = document.createElement("div");
        chip.className = "player-chip" + (p.id === state.activeId ? " active" : "");
        const total = playerTotal(p);
        chip.innerHTML = `
            <div class="swatch" style="background:${p.color}"></div>
            <div class="name">${escapeHtml(p.name)}</div>
            <div class="score-mini">${total}</div>`;
        chip.addEventListener("click", () => {
            state.activeId = p.id;
            save();
            render();
        });
        tabs.appendChild(chip);
    });
    if (state.players.length < 6) {
        const add = document.createElement("div");
        add.className = "player-chip add";
        add.innerHTML = "+ 添加";
        add.addEventListener("click", () => addPlayer());
        tabs.appendChild(add);
    }
    area.appendChild(tabs);

    const active = getActivePlayer();
    if (!active) { updateTotalBar(); return; }

    // Player header card
    const head = document.createElement("div");
    head.className = "player-card-head";
    head.innerHTML = `
        <div class="color-pick" style="background:${active.color}" title="点击换颜色"></div>
        <input class="name-input" type="text" maxlength="12" value="${escapeHtml(active.name)}" />
        ${state.players.length > 1 ? '<button class="del-btn" title="删除玩家">🗑</button>' : ''}`;
    area.appendChild(head);
    head.querySelector(".color-pick").addEventListener("click", () => openColorPick(active.id));
    head.querySelector(".name-input").addEventListener("change", (e) => {
        active.name = e.target.value.trim() || active.name;
        save(); render();
    });
    const delBtn = head.querySelector(".del-btn");
    if (delBtn) delBtn.addEventListener("click", () => deletePlayer(active.id));

    // Tracks card (盾轨 / 票轨)
    area.appendChild(renderTracksCard(active));

    // Break income rounds
    area.appendChild(renderRoundsCard(active));

    updateTotalBar();
}

function addAddPlayerChip(parent) {
    const tabs = document.createElement("div");
    tabs.className = "player-tabs";
    const add = document.createElement("div");
    add.className = "player-chip add";
    add.innerHTML = "+ 添加玩家";
    add.addEventListener("click", () => addPlayer());
    tabs.appendChild(add);
    parent.appendChild(tabs);
}

function renderTracksCard(p) {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
        <div class="card-head">
            <div class="label"><span class="ico">🎯</span>当前状态</div>
            <div class="meta">盾轨 <b>${Number(p.conservation)||0}</b> · 票轨 <b>${Number(p.appeal)||0}</b></div>
        </div>
        <div class="card-body"></div>`;
    const body = card.querySelector(".card-body");

    // 盾轨
    const shieldRow = document.createElement("div");
    shieldRow.className = "track-row";
    shieldRow.innerHTML = `
        <div class="info">
            <div class="name">🛡️ 盾轨 · 保护项目点数</div>
            <div class="desc">完成保护项目 / 触发协会行动时前进</div>
        </div>
        <div class="num-stepper">
            <button data-act="dec">−</button>
            <input type="number" inputmode="numeric" min="0" max="50" value="${Number(p.conservation)||0}" />
            <button data-act="inc">+</button>
        </div>`;
    bindStepper(shieldRow, p, "conservation", 0, 50);
    body.appendChild(shieldRow);

    // 票轨
    const appealRow = document.createElement("div");
    appealRow.className = "track-row";
    appealRow.innerHTML = `
        <div class="info">
            <div class="name">🎫 票轨 · 魅力点数</div>
            <div class="desc">放入动物 / 场馆等提升魅力时前进</div>
        </div>
        <div class="num-stepper">
            <button data-act="dec">−</button>
            <input type="number" inputmode="numeric" min="0" max="200" value="${Number(p.appeal)||0}" />
            <button data-act="inc">+</button>
        </div>`;
    bindStepper(appealRow, p, "appeal", 0, 200);
    body.appendChild(appealRow);

    const hint = document.createElement("div");
    hint.className = "track-hint";
    hint.textContent = "票轨位置决定每轮休息时「魅力对应收入」。盾轨用于游戏结束判定（两轨相遇即终局）。";
    body.appendChild(hint);

    return card;
}

function bindStepper(row, p, key, min, max) {
    const input = row.querySelector("input");
    const inc = () => {
        let v = (Number(p[key]) || 0) + 1;
        if (v > max) v = max;
        p[key] = v; input.value = v; save();
        onTrackChange(p);
    };
    const dec = () => {
        let v = (Number(p[key]) || 0) - 1;
        if (v < min) v = min;
        p[key] = v; input.value = v; save();
        onTrackChange(p);
    };
    row.querySelector('[data-act="inc"]').addEventListener("click", inc);
    row.querySelector('[data-act="dec"]').addEventListener("click", dec);
    input.addEventListener("change", () => {
        let v = parseInt(input.value, 10);
        if (isNaN(v)) v = min;
        v = Math.max(min, Math.min(max, v));
        p[key] = v; input.value = v; save();
        onTrackChange(p);
    });
}

function onTrackChange(p) {
    // 票轨/盾轨变化时刷新整页（卡片头汇总、底部条、各轮魅力对应收入展示）
    render();
}

function renderRoundsCard(p) {
    const card = document.createElement("div");
    card.className = "card";
    const total = playerTotal(p);
    card.innerHTML = `
        <div class="card-head">
            <div class="label"><span class="ico">💰</span>休息收入记录</div>
            <div class="meta">累计 <b>${total}</b> 钱</div>
        </div>
        <div class="card-body" id="rounds-body"></div>`;
    const body = card.querySelector("#rounds-body");

    if (!p.rounds || p.rounds.length === 0) {
        const empty = document.createElement("div");
        empty.style.cssText = "text-align:center;color:var(--muted);padding:18px 0 14px;font-size:13px;";
        empty.textContent = "还没有休息记录。点击下方按钮添加一轮休息。";
        body.appendChild(empty);
    } else {
        p.rounds.forEach((r, i) => {
            body.appendChild(renderRoundCard(p, r, i + 1));
        });
    }

    const addBtn = document.createElement("button");
    addBtn.className = "add-round-btn";
    addBtn.textContent = "+ 记录一轮休息";
    addBtn.addEventListener("click", () => {
        p.rounds.push(newRound(p));
        save(); render();
    });
    body.appendChild(addBtn);

    return card;
}

function renderRoundCard(p, r, idx) {
    const appealInc = roundAppealIncome(r);
    const total = roundTotal(r);
    const rc = document.createElement("div");
    rc.className = "round-card";
    rc.innerHTML = `
        <div class="round-head">
            <div class="title">🛏️ 第 ${idx} 轮休息</div>
            <div>
                <span class="total">+${total} 钱</span>
                <button class="del" title="删除本轮">✕</button>
            </div>
        </div>
        <div class="round-body"></div>`;
    const rb = rc.querySelector(".round-body");

    // 快照信息
    const snap = document.createElement("div");
    snap.style.cssText = "font-size:11px;color:var(--muted);padding:6px 0 4px;";
    snap.innerHTML = `记录时状态：🛡️ 盾轨 <b style="color:var(--ink)">${Number(r.conservation)||0}</b> · 🎫 票轨 <b style="color:var(--ink)">${Number(r.appeal)||0}</b>`;
    rb.appendChild(snap);

    // 魅力对应收入（计算展示）
    const appealRow = document.createElement("div");
    appealRow.className = "income-row";
    const pending = APPEAL_INCOME_PENDING;
    appealRow.innerHTML = `
        <div class="label-name">
            魅力对应收入
            ${pending ? '<span class="badge">公式待补充</span>' : ''}
            <span class="desc">由票轨位置自动计算</span>
        </div>
        <div class="calc-display${pending ? ' pending' : ''}">${appealInc}</div>`;
    rb.appendChild(appealRow);

    // 贩售亭收入
    const kioskRow = document.createElement("div");
    kioskRow.className = "income-row";
    kioskRow.innerHTML = `
        <div class="label-name">
            贩售亭收入
            <span class="desc">每座贩售亭对应钱数（手动输入）</span>
        </div>
        <input class="num-input" type="number" inputmode="numeric" min="0" value="${Number(r.kioskIncome)||0}" />`;
    kioskRow.querySelector("input").addEventListener("change", (e) => {
        r.kioskIncome = Math.max(0, parseInt(e.target.value, 10) || 0);
        save(); render();
    });
    rb.appendChild(kioskRow);

    // 卡牌额外收入
    const cardRow = document.createElement("div");
    cardRow.className = "income-row";
    cardRow.innerHTML = `
        <div class="label-name">
            卡牌额外收入
            <span class="desc">卡牌效果带来的额外钱（可负数）</span>
        </div>
        <input class="num-input" type="number" inputmode="numeric" value="${Number(r.cardIncome)||0}" />`;
    cardRow.querySelector("input").addEventListener("change", (e) => {
        let v = parseInt(e.target.value, 10);
        if (isNaN(v)) v = 0;
        r.cardIncome = v; save(); render();
    });
    rb.appendChild(cardRow);

    // 本轮合计
    const totalRow = document.createElement("div");
    totalRow.className = "row-total";
    totalRow.innerHTML = `<span class="lbl">本轮合计</span><span class="val">+${total} 钱</span>`;
    rb.appendChild(totalRow);

    rc.querySelector(".del").addEventListener("click", () => deleteRound(p, r.id));

    return rc;
}

/* ============ Total Bar ============ */
function updateTotalBar() {
    const p = getActivePlayer();
    const nameEl = document.getElementById("total-bar-name");
    const valEl = document.getElementById("total-bar-value");
    const tracksEl = document.getElementById("total-bar-tracks");
    if (!p) {
        nameEl.textContent = "—";
        tracksEl.textContent = "";
        valEl.innerHTML = '0<span class="small"> 钱</span>';
        return;
    }
    nameEl.textContent = p.name;
    tracksEl.innerHTML = `🛡️ 盾轨 <b>${Number(p.conservation)||0}</b> · 🎫 票轨 <b>${Number(p.appeal)||0}</b>`;
    const total = playerTotal(p);
    valEl.innerHTML = `${total}<span class="small"> 钱</span>`;
}

/* ============ Player Management ============ */
function addPlayer() {
    if (state.players.length >= 6) { toast("最多支持 6 位玩家"); return; }
    const p = newPlayer(state.players.length);
    state.players.push(p);
    state.activeId = p.id;
    save(); render();
    toast("已添加 " + p.name);
}

function deletePlayer(id) {
    const idx = state.players.findIndex(p => p.id === id);
    if (idx < 0) return;
    const name = state.players[idx].name;
    showConfirm(`确定删除「${name}」吗？`, () => {
        state.players.splice(idx, 1);
        if (state.activeId === id) {
            state.activeId = state.players[0] ? state.players[0].id : null;
        }
        save(); render();
    });
}

function deleteRound(p, rid) {
    showConfirm("删除这一轮休息记录？", () => {
        const i = (p.rounds || []).findIndex(r => r.id === rid);
        if (i >= 0) { p.rounds.splice(i, 1); save(); render(); }
    });
}

/* ============ Color Picker ============ */
function openColorPick(playerId) {
    pendingColorPickFor = playerId;
    const pop = document.getElementById("color-pop");
    const sw = document.getElementById("color-swatches");
    sw.innerHTML = "";
    PLAYER_COLORS.forEach(c => {
        const el = document.createElement("div");
        el.className = "sw";
        el.style.background = c;
        el.addEventListener("click", () => {
            const p = state.players.find(x => x.id === pendingColorPickFor);
            if (p) { p.color = c; save(); render(); }
            pop.classList.remove("show");
        });
        sw.appendChild(el);
    });
    pop.classList.add("show");
}
document.getElementById("color-pop").addEventListener("click", (e) => {
    if (e.target.id === "color-pop") {
        document.getElementById("color-pop").classList.remove("show");
    }
});

/* ============ Confirm Dialog ============ */
function showConfirm(msg, onYes) {
    document.getElementById("confirm-msg").textContent = msg;
    pendingConfirmCb = onYes;
    document.getElementById("confirm-pop").classList.add("show");
}
document.getElementById("confirm-yes").addEventListener("click", () => {
    document.getElementById("confirm-pop").classList.remove("show");
    if (pendingConfirmCb) { pendingConfirmCb(); pendingConfirmCb = null; }
});
document.getElementById("confirm-no").addEventListener("click", () => {
    document.getElementById("confirm-pop").classList.remove("show");
    pendingConfirmCb = null;
});

/* ============ Toast ============ */
let toastTimer = null;
function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1500);
}

/* ============ Top buttons ============ */
document.getElementById("btn-save").addEventListener("click", () => {
    save(); toast("已保存到本机");
});
document.getElementById("btn-reset").addEventListener("click", () => {
    showConfirm("确定清空所有玩家与记录吗？此操作不可撤销。", () => {
        state = { players: [], activeId: null };
        save(); render();
        toast("已重置");
    });
});

/* ============ Utils ============ */
function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
}

/* ============ Init ============ */
function init() {
    load();
    if (state.players.length === 0) {
        state.players = [newPlayer(0), newPlayer(1)];
        state.activeId = state.players[0].id;
        save();
    }
    render();
}
init();

})();
</script>
</body>
</html>
