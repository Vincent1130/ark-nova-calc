<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>方舟动物园 · 休息收入</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
    --green-900: #1b4332;
    --green-700: #2d6a4f;
    --green-500: #40916c;
    --green-100: #d8f3dc;
    --orange: #e76f51;
    --orange-dark: #c4593c;
    --gold: #e9b949;
    --cream: #faf6ee;
    --ink: #1f2a24;
    --muted: #6c7a72;
    --line: #e3dcc9;
    --card: #ffffff;
    --shadow: 0 2px 10px rgba(31, 42, 36, 0.08);
    --shadow-lg: 0 6px 24px rgba(31, 42, 36, 0.12);
}

html, body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: var(--cream);
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
}

/* ===== Header ===== */
.app-header {
    position: sticky; top: 0; z-index: 50;
    background: linear-gradient(135deg, var(--green-900), var(--green-700));
    color: #fff;
    padding: 12px 16px;
    box-shadow: 0 2px 12px rgba(27, 67, 50, 0.25);
}
.app-header .brand {
    display: flex; align-items: center; justify-content: space-between;
}
.app-header .brand .title { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; }
.app-header .brand .title .sub { font-size: 11px; font-weight: 400; opacity: 0.7; margin-left: 6px; }
.app-header .brand .actions { display: flex; gap: 6px; }
.icon-btn {
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    width: 32px; height: 32px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background 0.15s;
}
.icon-btn:active { background: rgba(255,255,255,0.28); }

/* ============ Mobile view (< 820px) ============ */
#mobile-view { display: block; padding: 14px 14px 100px; max-width: 560px; margin: 0 auto; }
#grid-view { display: none; }

@media (min-width: 820px) {
    #mobile-view { display: none; }
    #grid-view {
        display: block;
        padding: 18px 20px 30px;
        max-width: 1400px;
        margin: 0 auto;
    }
}

/* ===== Mobile: Player tabs ===== */
.player-tabs {
    display: flex; gap: 8px;
    overflow-x: auto;
    padding: 2px 0 12px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
}
.player-tabs::-webkit-scrollbar { display: none; }
.player-chip {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 6px;
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 999px;
    padding: 6px 12px 6px 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    transition: all 0.15s;
    max-width: 200px;
}
.player-chip .swatch {
    width: 22px; height: 22px;
    border-radius: 50%;
    flex-shrink: 0;
    border: 2px solid rgba(0,0,0,0.1);
}
.player-chip .name {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 110px;
}
.player-chip.active {
    border-color: var(--green-700);
    color: var(--green-900);
    background: var(--green-100);
}
.player-chip.add {
    background: transparent;
    border-style: dashed;
    color: var(--green-700);
}
.player-chip .money-mini {
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
    margin-left: 2px;
}
.player-chip.active .money-mini { color: var(--orange-dark); }

/* ============ Player card (shared) ============ */
.pcard {
    background: var(--card);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
    position: relative;
}
.pcard .phead {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #fff, #fcfaf3);
}
.pcard .phead .color-pick {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 2px solid #fff;
    box-shadow: 0 0 0 2px var(--line);
    cursor: pointer;
    flex-shrink: 0;
}
.pcard .phead input.name-input {
    flex: 1;
    border: 0;
    border-bottom: 2px solid transparent;
    background: transparent;
    font-size: 15px;
    font-weight: 700;
    color: var(--ink);
    padding: 4px 2px;
    font-family: inherit;
    min-width: 0;
}
.pcard .phead input.name-input:focus { outline: 0; border-bottom-color: var(--green-500); }
.pcard .phead .del-btn {
    background: transparent; border: 0; color: var(--muted);
    font-size: 18px; cursor: pointer; padding: 2px 6px;
}
.pcard .pbody { padding: 10px 14px 12px; }

/* break income highlight (per card) */
.break-box {
    background: linear-gradient(135deg, var(--green-100), #eaf5e9);
    border: 1.5px solid var(--green-500);
    border-radius: 12px;
    padding: 10px 14px;
    margin: 4px 0 10px;
    display: flex; justify-content: space-between; align-items: center;
}
.break-box .lbl { font-size: 12px; color: var(--green-900); font-weight: 600; }
.break-box .lbl .desc { font-size: 10px; color: var(--muted); font-weight: 400; display: block; margin-top: 1px; }
.break-box .val {
    font-size: 26px; font-weight: 800; color: var(--orange-dark);
    letter-spacing: -0.5px;
}
.break-box .val .unit { font-size: 12px; font-weight: 500; opacity: 0.7; margin-left: 2px; }

/* ===== Track rows ===== */
.track-row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 9px 0;
    border-bottom: 1px dashed var(--line);
}
.track-row:last-child { border-bottom: 0; }
.track-row .info .name { font-size: 13px; font-weight: 600; }
.track-row .info .desc { font-size: 10px; color: var(--muted); margin-top: 1px; }
.num-stepper {
    display: flex; align-items: center;
    background: var(--cream);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
}
.num-stepper button {
    width: 34px; height: 34px;
    background: transparent; border: 0;
    color: var(--green-700);
    font-size: 19px; font-weight: 700;
    cursor: pointer;
    transition: background 0.12s;
    flex-shrink: 0;
}
.num-stepper button:active { background: var(--green-100); }
.num-stepper input {
    width: 48px; text-align: center; border: 0; background: transparent;
    font-size: 16px; font-weight: 700; color: var(--ink);
    font-family: inherit; padding: 5px 0;
}
.num-stepper input:focus { outline: 0; background: #fff; }

/* ===== Income rows (per card, shared) ===== */
.income-row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px dashed var(--line);
}
.income-row:last-child { border-bottom: 0; }
.income-row .label-name { font-size: 13px; }
.income-row .label-name .desc { font-size: 10px; color: var(--muted); display: block; margin-top: 1px; }
.income-row .label-name .badge {
    display: inline-block; font-size: 9px; color: var(--orange-dark);
    background: #fde9e3; padding: 1px 5px; border-radius: 4px;
    margin-left: 4px; font-weight: 600; vertical-align: middle;
}
.num-input {
    width: 64px; text-align: center;
    border: 1px solid var(--line); background: var(--cream);
    border-radius: 8px; padding: 6px 4px;
    font-size: 14px; font-weight: 600; color: var(--ink);
    font-family: inherit;
}
.num-input:focus { outline: 2px solid var(--green-500); background: #fff; }
.calc-display {
    min-width: 64px; text-align: center;
    background: var(--green-100); color: var(--green-700);
    border-radius: 8px; padding: 6px 4px;
    font-size: 14px; font-weight: 700;
}
.calc-display.pending { background: #fde9e3; color: var(--orange-dark); }

/* ===== Mobile sticky total bar ===== */
.total-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(135deg, var(--green-900), var(--green-700));
    color: #fff;
    padding: 12px 16px;
    display: flex; justify-content: space-between; align-items: center;
    box-shadow: 0 -4px 16px rgba(27, 67, 50, 0.2);
    z-index: 40;
}
.total-bar .label { font-size: 12px; opacity: 0.85; }
.total-bar .player-name { font-size: 14px; font-weight: 600; margin-top: 1px; }
.total-bar .money {
    font-size: 30px; font-weight: 800; letter-spacing: -0.5px;
}
.total-bar .money .small { font-size: 12px; font-weight: 500; opacity: 0.7; }

/* ===== Grid (tablet) layout ===== */
.players-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 16px;
}
.players-grid .pcol { display: flex; }
.grid-break-box {
    background: linear-gradient(135deg, var(--green-700), var(--green-900));
    color: #fff;
    border-radius: 12px;
    padding: 12px 14px;
    margin: 4px 0 12px;
    display: flex; justify-content: space-between; align-items: center;
}
.grid-break-box .lbl { font-size: 12px; opacity: 0.9; font-weight: 600; }
.grid-break-box .lbl .desc { font-size: 10px; opacity: 0.75; font-weight: 400; display: block; margin-top: 1px; }
.grid-break-box .val { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; }
.grid-break-box .val .unit { font-size: 12px; font-weight: 500; opacity: 0.7; margin-left: 2px; }

.grid-add-btn {
    width: 100%;
    background: var(--card);
    border: 2px dashed var(--line);
    color: var(--green-700);
    padding: 20px;
    border-radius: 14px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
}
.grid-add-btn:active { background: var(--green-100); border-color: var(--green-500); }

/* ===== Mobile empty state ===== */
.empty-state {
    text-align: center;
    padding: 50px 20px;
    color: var(--muted);
}
.empty-state .big { font-size: 48px; margin-bottom: 12px; }

/* ===== Color picker popover ===== */
.color-pop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 100;
    display: none;
    align-items: center; justify-content: center;
    padding: 20px;
}
.color-pop.show { display: flex; }
.color-pop .panel {
    background: #fff; border-radius: 14px; padding: 18px;
    max-width: 320px; width: 100%;
}
.color-pop .panel h4 { font-size: 14px; margin-bottom: 12px; color: var(--green-900); }
.color-pop .swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.color-pop .swatches .sw {
    aspect-ratio: 1; border-radius: 50%;
    border: 2px solid rgba(0,0,0,0.1);
    cursor: pointer; transition: transform 0.1s;
}
.color-pop .swatches .sw:active { transform: scale(0.9); }

/* ===== Confirm dialog ===== */
.confirm-pop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 110;
    display: none;
    align-items: center; justify-content: center;
    padding: 24px;
}
.confirm-pop.show { display: flex; }
.confirm-pop .panel {
    background: #fff; border-radius: 14px; padding: 20px;
    max-width: 320px; width: 100%; text-align: center;
}
.confirm-pop .panel p { font-size: 14px; margin-bottom: 16px; color: var(--ink); }
.confirm-pop .panel .btns { display: flex; gap: 10px; }
.confirm-pop .panel .btns button {
    flex: 1; padding: 10px; border-radius: 8px; border: 0;
    font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
}
.confirm-pop .panel .btns .yes { background: var(--orange); color: #fff; }
.confirm-pop .panel .btns .no { background: var(--cream); color: var(--muted); border: 1px solid var(--line); }

/* ===== Toast ===== */
.toast {
    position: fixed;
    bottom: 96px; left: 50%;
    transform: translateX(-50%);
    background: rgba(27, 42, 36, 0.95);
    color: #fff;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 13px;
    z-index: 200;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
}
.toast.show { opacity: 1; }

/* Tablet: tweak card sizes */
@media (min-width: 820px) and (max-width: 1100px) {
    .players-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (min-width: 1100px) {
    .players-grid { grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); }
}
</style>
</head>
<body>

<header class="app-header">
    <div class="brand">
        <div class="title">方舟动物园 · 休息收入<span class="sub">Break Income</span></div>
        <div class="actions">
            <button class="icon-btn" id="btn-save" title="保存">💾</button>
            <button class="icon-btn" id="btn-reset" title="重置">↺</button>
        </div>
    </div>
</header>

<!-- ============ Mobile view ============ -->
<section id="mobile-view">
    <div id="mobile-tabs"></div>
    <div id="mobile-card"></div>
</section>

<!-- ============ Grid (tablet) view ============ -->
<section id="grid-view">
    <div class="players-grid" id="grid-area"></div>
</section>

<!-- ============ Mobile sticky total bar ============ -->
<div class="total-bar" id="total-bar">
    <div>
        <div class="label">当前玩家休息可得</div>
        <div class="player-name" id="total-bar-name">—</div>
    </div>
    <div class="money" id="total-bar-value">0<span class="small"> 钱</span></div>
</div>

<!-- ============ Color picker popover ============ -->
<div class="color-pop" id="color-pop">
    <div class="panel">
        <h4>选择玩家颜色</h4>
        <div class="swatches" id="color-swatches"></div>
    </div>
</div>

<!-- ============ Confirm dialog ============ -->
<div class="confirm-pop" id="confirm-pop">
    <div class="panel">
        <p id="confirm-msg">确定要重置所有数据吗？</p>
        <div class="btns">
            <button class="no" id="confirm-no">取消</button>
            <button class="yes" id="confirm-yes">确定</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ============ Constants ============ */
const STORAGE_KEY = "ark-nova-break-v2";
const PLAYER_COLORS = [
    "#e63946", "#2a9d8f", "#f4a261", "#457b9d",
    "#9b5de5", "#ffb703"
];
const DEFAULT_NAMES = ["玩家 1", "玩家 2", "玩家 3", "玩家 4"];
const MAX_PLAYERS = 4;

/* ============ State ============ */
let state = { players: [], activeId: null };
let pendingColorPickFor = null;
let pendingConfirmCb = null;

/* ============ Persistence ============ */
function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {} }
function load() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && Array.isArray(parsed.players)) {
                state = parsed;
                if (!state.activeId && state.players.length) state.activeId = state.players[0].id;
            }
        }
    } catch(e) {}
}

/* ============ Helpers ============ */
function uid() { return "p" + Date.now().toString(36) + Math.random().toString(36).slice(2,5); }
function newPlayer(idx) {
    return {
        id: uid(),
        name: DEFAULT_NAMES[idx] || ("玩家 " + (idx+1)),
        color: PLAYER_COLORS[idx % PLAYER_COLORS.length],
        conservation: 0,
        appeal: 0,
        kioskIncome: 0,
        cardIncome: 0
    };
}

/**
 * 魅力对应收入计算
 * @param {number} conservation 盾轨（保护项目点数，本计算不使用）
 * @param {number} appeal       票轨（魅力点数）
 * @return {number} 休息时由魅力对应得到的钱数
 *
 * 规则：0 票 = 5 元起；下列每档上限每过一档 +1 元。
 * 序列为各档票数上限：0 1 2 3 4 6 8 10 12 14 16 19 22 25 28 31 35 39 43 47 51 55 60 65 70 75 80 85 90 95 101 107 113
 * 例：5/6 票 → 10 元；7/8 票 → 11 元；113 票 → 37 元；超过 113 封顶 37 元。
 */
const APPEAL_TIERS = [0,1,2,3,4,6,8,10,12,14,16,19,22,25,28,31,35,39,43,47,51,55,60,65,70,75,80,85,90,95,101,107,113];
const APPEAL_BASE_INCOME = 5;
function calcAppealIncome(conservation, appeal) {
    const a = Math.max(0, Number(appeal) || 0);
    let idx = APPEAL_TIERS.length - 1; // 超出最大档则封顶
    for (let i = 0; i < APPEAL_TIERS.length; i++) {
        if (a <= APPEAL_TIERS[i]) { idx = i; break; }
    }
    void conservation;
    return APPEAL_BASE_INCOME + idx;
}
const APPEAL_INCOME_PENDING = false;

function breakIncome(p) {
    return calcAppealIncome(p.conservation, p.appeal)
         + (Number(p.kioskIncome) || 0)
         + (Number(p.cardIncome) || 0);
}
function getActivePlayer() {
    return state.players.find(p => p.id === state.activeId) || state.players[0] || null;
}

/* ============ Rendering ============ */
function render() {
    if (state.players.length === 0) {
        // both views: empty
        document.getElementById("mobile-tabs").innerHTML = "";
        document.getElementById("mobile-card").innerHTML =
            `<div class="empty-state"><div class="big">🦁</div>
             <div>还没有玩家</div>
             <button class="grid-add-btn" style="margin-top:16px;max-width:200px;" id="empty-add">+ 添加玩家</button></div>`;
        document.getElementById("grid-area").innerHTML = "";
        const ea = document.getElementById("empty-add");
        if (ea) ea.addEventListener("click", () => addPlayer());
        updateTotalBar();
        return;
    }

    // ---- Mobile ----
    renderMobileTabs();
    renderMobileCard();

    // ---- Grid (tablet) ----
    renderGrid();

    updateTotalBar();
}

/* ===== Mobile tabs ===== */
function renderMobileTabs() {
    const tabs = document.getElementById("mobile-tabs");
    tabs.className = "player-tabs";
    tabs.innerHTML = "";
    state.players.forEach(p => {
        const chip = document.createElement("div");
        chip.className = "player-chip" + (p.id === state.activeId ? " active" : "");
        const m = breakIncome(p);
        chip.innerHTML = `
            <div class="swatch" style="background:${p.color}"></div>
            <div class="name">${escapeHtml(p.name)}</div>
            <div class="money-mini">${m}</div>`;
        chip.addEventListener("click", () => {
            state.activeId = p.id; save(); render();
        });
        tabs.appendChild(chip);
    });
    if (state.players.length < MAX_PLAYERS) {
        const add = document.createElement("div");
        add.className = "player-chip add";
        add.innerHTML = "+ 添加";
        add.addEventListener("click", () => addPlayer());
        tabs.appendChild(add);
    }
}

/* ===== Mobile active card ===== */
function renderMobileCard() {
    const area = document.getElementById("mobile-card");
    area.innerHTML = "";
    const p = getActivePlayer();
    if (!p) return;
    area.appendChild(buildPlayerCard(p, /*mobile*/ true));
}

/* ===== Grid (tablet) ===== */
function renderGrid() {
    const area = document.getElementById("grid-area");
    area.innerHTML = "";
    state.players.forEach(p => {
        const col = document.createElement("div");
        col.className = "pcol";
        col.appendChild(buildPlayerCard(p, /*mobile*/ false));
        area.appendChild(col);
    });
    if (state.players.length < MAX_PLAYERS) {
        const col = document.createElement("div");
        col.className = "pcol";
        const btn = document.createElement("button");
        btn.className = "grid-add-btn";
        btn.textContent = "+ 添加玩家";
        btn.addEventListener("click", () => addPlayer());
        col.appendChild(btn);
        area.appendChild(col);
    }
}

/* ===== Build a player card (shared) =====
 * mobile=true: show break box at top, sticky bar reflects it
 * mobile=false (grid): show break box (dark) at top
 */
function buildPlayerCard(p, mobile) {
    const card = document.createElement("div");
    card.className = "pcard";

    // Break income highlight
    const m = breakIncome(p);
    if (mobile) {
        card.insertAdjacentHTML("beforeend", `
            <div class="break-box">
                <div class="lbl">休息可得<div class="desc">魅力对应 + 贩售亭 + 卡牌额外</div></div>
                <div class="val">${m}<span class="unit">钱</span></div>
            </div>`);
    } else {
        card.insertAdjacentHTML("beforeend", `
            <div class="grid-break-box">
                <div class="lbl">休息可得<div class="desc">魅力对应 + 贩售亭 + 卡牌额外</div></div>
                <div class="val">${m}<span class="unit">钱</span></div>
            </div>`);
    }

    // Header
    const head = document.createElement("div");
    head.className = "phead";
    head.innerHTML = `
        <div class="color-pick" style="background:${p.color}" title="点击换颜色"></div>
        <input class="name-input" type="text" maxlength="12" value="${escapeHtml(p.name)}" />
        ${state.players.length > 1 ? '<button class="del-btn" title="删除玩家">✕</button>' : ''}`;
    card.appendChild(head);
    head.querySelector(".color-pick").addEventListener("click", () => openColorPick(p.id));
    head.querySelector(".name-input").addEventListener("change", (e) => {
        p.name = e.target.value.trim() || p.name; save(); render();
    });
    const del = head.querySelector(".del-btn");
    if (del) del.addEventListener("click", () => deletePlayer(p.id));

    // Body
    const body = document.createElement("div");
    body.className = "pbody";

    // Tracks
    body.appendChild(makeTrackRow(p, "conservation", "🛡️ 盾轨 · 保护项目点数", "完成保护项目时前进", 0, 50));
    body.appendChild(makeTrackRow(p, "appeal", "🎫 票轨 · 魅力点数", "提升魅力时前进", 0, 200));

    // divider
    const div = document.createElement("div");
    div.style.cssText = "height:1px;background:var(--line);margin:4px 0;";
    body.appendChild(div);

    // Kiosk income (input)
    body.appendChild(makeInputRow(p, "kioskIncome", "🏪 贩售亭收入", "手动输入", 0));
    // Card extra income (input)
    body.appendChild(makeInputRow(p, "cardIncome", "🃏 卡牌额外收入", "卡牌效果（可负数）", null));
    // Appeal income (calc)
    body.appendChild(makeCalcRow(p));

    card.appendChild(body);
    return card;
}

function makeTrackRow(p, key, name, desc, min, max) {
    const row = document.createElement("div");
    row.className = "track-row";
    row.innerHTML = `
        <div class="info">
            <div class="name">${name}</div>
            <div class="desc">${desc}</div>
        </div>
        <div class="num-stepper">
            <button data-act="dec">−</button>
            <input type="number" inputmode="numeric" min="${min}" max="${max}" value="${Number(p[key])||0}" />
            <button data-act="inc">+</button>
        </div>`;
    const input = row.querySelector("input");
    const inc = () => { let v = Math.min(max, (Number(p[key])||0) + 1); p[key] = v; input.value = v; save(); render(); };
    const dec = () => { let v = Math.max(min, (Number(p[key])||0) - 1); p[key] = v; input.value = v; save(); render(); };
    row.querySelector('[data-act="inc"]').addEventListener("click", inc);
    row.querySelector('[data-act="dec"]').addEventListener("click", dec);
    input.addEventListener("change", () => {
        let v = parseInt(input.value, 10);
        if (isNaN(v)) v = min;
        v = Math.max(min, Math.min(max, v));
        p[key] = v; input.value = v; save(); render();
    });
    return row;
}

function makeInputRow(p, key, label, desc, min) {
    const row = document.createElement("div");
    row.className = "income-row";
    row.innerHTML = `
        <div class="label-name">${label}<span class="desc">${desc}</span></div>
        <input class="num-input" type="number" inputmode="numeric" ${min!==null?`min="${min}"`:""} value="${Number(p[key])||0}" />`;
    row.querySelector("input").addEventListener("change", (e) => {
        let v = parseInt(e.target.value, 10);
        if (isNaN(v)) v = 0;
        if (min !== null) v = Math.max(min, v);
        p[key] = v; save(); render();
    });
    return row;
}

function makeCalcRow(p) {
    const row = document.createElement("div");
    row.className = "income-row";
    const v = calcAppealIncome(p.conservation, p.appeal);
    const pending = APPEAL_INCOME_PENDING;
    row.innerHTML = `
        <div class="label-name">
            魅力对应收入
            ${pending ? '<span class="badge">公式待补充</span>' : ''}
            <span class="desc">由票轨位置自动计算</span>
        </div>
        <div class="calc-display${pending ? ' pending' : ''}">${v}</div>`;
    return row;
}

/* ============ Total Bar (mobile) ============ */
function updateTotalBar() {
    const p = getActivePlayer();
    const nameEl = document.getElementById("total-bar-name");
    const valEl = document.getElementById("total-bar-value");
    if (!p) {
        nameEl.textContent = "—";
        valEl.innerHTML = '0<span class="small"> 钱</span>';
        return;
    }
    nameEl.textContent = p.name;
    valEl.innerHTML = `${breakIncome(p)}<span class="small"> 钱</span>`;
}

/* ============ Player Management ============ */
function addPlayer() {
    if (state.players.length >= MAX_PLAYERS) { toast(`最多 ${MAX_PLAYERS} 位玩家`); return; }
    const p = newPlayer(state.players.length);
    state.players.push(p);
    state.activeId = p.id;
    save(); render();
    toast("已添加 " + p.name);
}
function deletePlayer(id) {
    const idx = state.players.findIndex(p => p.id === id);
    if (idx < 0) return;
    const name = state.players[idx].name;
    showConfirm(`确定删除「${name}」吗？`, () => {
        state.players.splice(idx, 1);
        if (state.activeId === id) {
            state.activeId = state.players[0] ? state.players[0].id : null;
        }
        save(); render();
    });
}

/* ============ Color Picker ============ */
function openColorPick(playerId) {
    pendingColorPickFor = playerId;
    const pop = document.getElementById("color-pop");
    const sw = document.getElementById("color-swatches");
    sw.innerHTML = "";
    PLAYER_COLORS.forEach(c => {
        const el = document.createElement("div");
        el.className = "sw";
        el.style.background = c;
        el.addEventListener("click", () => {
            const p = state.players.find(x => x.id === pendingColorPickFor);
            if (p) { p.color = c; save(); render(); }
            pop.classList.remove("show");
        });
        sw.appendChild(el);
    });
    pop.classList.add("show");
}
document.getElementById("color-pop").addEventListener("click", (e) => {
    if (e.target.id === "color-pop") document.getElementById("color-pop").classList.remove("show");
});

/* ============ Confirm Dialog ============ */
function showConfirm(msg, onYes) {
    document.getElementById("confirm-msg").textContent = msg;
    pendingConfirmCb = onYes;
    document.getElementById("confirm-pop").classList.add("show");
}
document.getElementById("confirm-yes").addEventListener("click", () => {
    document.getElementById("confirm-pop").classList.remove("show");
    if (pendingConfirmCb) { pendingConfirmCb(); pendingConfirmCb = null; }
});
document.getElementById("confirm-no").addEventListener("click", () => {
    document.getElementById("confirm-pop").classList.remove("show");
    pendingConfirmCb = null;
});

/* ============ Toast ============ */
let toastTimer = null;
function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1500);
}

/* ============ Top buttons ============ */
document.getElementById("btn-save").addEventListener("click", () => { save(); toast("已保存到本机"); });
document.getElementById("btn-reset").addEventListener("click", () => {
    showConfirm("确定清空所有玩家与记录吗？此操作不可撤销。", () => {
        state = { players: [], activeId: null };
        save(); render();
        toast("已重置");
    });
});

/* ============ Utils ============ */
function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
}

/* ============ Init ============ */
function init() {
    load();
    if (state.players.length === 0) {
        state.players = [newPlayer(0), newPlayer(1)];
        state.activeId = state.players[0].id;
        save();
    }
    render();
}
init();

})();
</script>
</body>
</html>
